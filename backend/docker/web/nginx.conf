server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The console is a single-page app: unknown paths are routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxying the API through the same origin means the browser never needs CORS,
    # and the React build does not have to be rebuilt for each environment.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR lands in PR-4; the upgrade headers are here so the route does not have
    # to be touched again.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health/ {
        proxy_pass http://api:8080/health/;
    }
}
