listener 1883
allow_anonymous true

# WebSocket listener so a browser-side diagnostic can subscribe to the raw stream —
# the fallback the console is competing against.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Retained status topics are how a device's last known state survives a broker restart;
# the liveness tracker cross-checks these against Last Will and Testament messages.
max_queued_messages 10000
